name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend exists
        id: check
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run build --if-present

      - name: Skip (backend not present yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/ has no package.json yet — skipping until feature/backend merges"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend exists
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present

      - name: Skip (frontend not present yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "frontend/ has no package.json yet — skipping until feature/frontend merges"